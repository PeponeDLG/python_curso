{% extends "base.html" %}

{% block titulo %}Flash Messages{% endblock %}

{% block contenido %}
<h2>Añadir usuario</h2>
<form method="post">
    <input type="text" name="nombre" placeholder="Nombre">
    <button type="submit">Añadir</button>
</form>

<h2>Usuarios actuales</h2>
<ul>
    {% for u in usuarios %}
        <li>{{ u }}</li>
    {% endfor %}
</ul>
{% endblock %}
