version: '3.0'
services:
  
  #--------------------------------------------------
  # SERVICIO SERVIDOR DE BASE DE DATOS MARIADB
  #--------------------------------------------------

  # NOMBRE DEL SERVICIO
  datos:
    # IMAGEN USADA
    image: scasare178/bdpoo
    # NOMBRE QUE LE VOY A DAR AL CONTENEDOR
    container_name: mysql-POO
    # LISTA DE VALORES DE ENTORNO CON SUS VALORES
    environment:
      MYSQL_ROOT_PASSWORD: Trassierra2026$$
      MYSQL_DATABASE: almacen
      MYSQL_USER: user
      MYSQL_PASSWORD: poo
    # REDIRECCIÓN DE PUERTOS
    ports:
      - 3309:3306
    # VOLÚMENES A USAR POR EL CONTENEDOR
    volumes:
      # DOCKER VOLUME
      - data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./create_new_db.sql:/docker-entrypoint-initdb.d/create_new_db.sql  # NUEVO

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bd_phpmyadmin
    depends_on:
      - datos
    ports:
      - "8081:80"
    environment:
      PMA_HOST: datos
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: Trassierra2026$$

# DEFINICIÓN DE VOLÚMENES DOCKER A USAR POR LOS SERVICIOS
volumes:
  data:
    # TIPO DE DRIVER
    driver: local